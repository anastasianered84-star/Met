<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля - MetaBook</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        
        .container {
            width: 100%;
            max-width: 480px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .title {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .title h2 {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        
        .title p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
        }
        
        input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #818cf8;
            background: rgba(255, 255, 255, 0.15);
        }
        
        input.error {
            border-color: #ef4444;
        }
        
        .error-message {
            color: #ef4444;
            font-size: 0.75rem;
            margin-top: 0.25rem;
            display: none;
        }
        
        .btn {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 1rem;
        }
        
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }
        
        .footer-links {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .footer-links a {
            color: #818cf8;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .footer-links a:hover {
            text-decoration: underline;
        }
        
        .timer {
            display: none;
            text-align: center;
            font-size: 0.8rem;
            color: #f59e0b;
            margin-top: 0.5rem;
        }
        
        .step {
            display: none;
        }
        
        .step.active {
            display: block;
        }
        
        .password-strength {
            margin-top: 0.5rem;
        }
        
        .strength-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .strength-fill {
            width: 0%;
            height: 100%;
            transition: width 0.3s;
        }
        
        .strength-text {
            font-size: 0.7rem;
            margin-top: 0.25rem;
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <h1><i class="fa-solid fa-virtual-reality"></i> MetaBook</h1>
            </div>
            
            <div class="title">
                <h2>Сброс пароля</h2>
                <p id="stepDescription">Введите email для сброса пароля</p>
            </div>
            
            <!-- Шаг 1: Ввод email -->
            <div id="step1" class="step active">
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="resetEmail" placeholder="example@mail.com">
                    </div>
                    <div class="error-message" id="emailError"></div>
                </div>
                
                <button class="btn" id="sendCodeBtn" onclick="sendResetCode()">
                    <i class="fa-solid fa-paper-plane"></i> Отправить код
                </button>
                
                <div class="timer" id="timer"></div>
            </div>
            
            <!-- Шаг 2: Ввод кода и нового пароля -->
            <div id="step2" class="step">
                <div class="form-group">
                    <label>Код подтверждения</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-key"></i>
                        <input type="text" id="resetCode" placeholder="Введите 6-значный код" maxlength="6">
                    </div>
                    <div class="error-message" id="codeError"></div>
                </div>
                
                <div class="form-group">
                    <label>Новый пароль</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="newPassword" placeholder="Минимум 6 символов">
                    </div>
                    <div class="error-message" id="passwordError"></div>
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <div class="strength-text" id="strengthText">Надёжность пароля</div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Подтвердите пароль</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="Повторите пароль">
                    </div>
                    <div class="error-message" id="confirmError"></div>
                </div>
                
                <button class="btn" id="resetBtn" onclick="resetPassword()">
                    <i class="fa-solid fa-rotate-left"></i> Сбросить пароль
                </button>
            </div>
            
            <div class="footer-links">
                <a href="login.html"><i class="fa-solid fa-arrow-left"></i> Вернуться ко входу</a>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE_URL = 'https://metabook-production.up.railway.app/api';
        let resetEmail = '';
        let timerInterval = null;
        
        function showError(elementId, message) {
            const errorEl = document.getElementById(elementId);
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.style.display = 'block';
            }
        }
        
        function hideError(elementId) {
            const errorEl = document.getElementById(elementId);
            if (errorEl) {
                errorEl.style.display = 'none';
            }
        }
        
        function showNotification(message, type) {
            const notification = document.createElement('div');
            const colors = {
                success: '#10b981',
                error: '#ef4444',
                info: '#3b82f6'
            };
            
            notification.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i>
                <span>${message}</span>
            `;
            
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 1rem 1.5rem;
                background: ${colors[type] || colors.info};
                color: white;
                border-radius: 8px;
                z-index: 1000;
                display: flex;
                align-items: center;
                gap: 0.5rem;
                animation: slideIn 0.3s ease;
                cursor: pointer;
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 4000);
        }
        
        function checkPasswordStrength() {
            const password = document.getElementById('newPassword')?.value || '';
            const strengthFill = document.getElementById('strengthFill');
            const strengthText = document.getElementById('strengthText');
            
            if (!strengthFill || !strengthText) return;
            
            let strength = 0;
            let text = '';
            let color = '';
            
            if (password.length >= 8) strength += 20;
            if (password.match(/[a-z]+/)) strength += 20;
            if (password.match(/[A-Z]+/)) strength += 20;
            if (password.match(/[0-9]+/)) strength += 20;
            if (password.match(/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]+/)) strength += 20;
            
            if (strength <= 20) {
                text = 'Очень слабый';
                color = '#ef4444';
            } else if (strength <= 40) {
                text = 'Слабый';
                color = '#f97316';
            } else if (strength <= 60) {
                text = 'Средний';
                color = '#eab308';
            } else if (strength <= 80) {
                text = 'Сильный';
                color = '#84cc16';
            } else {
                text = 'Очень сильный';
                color = '#10b981';
            }
            
            strengthFill.style.width = strength + '%';
            strengthFill.style.backgroundColor = color;
            strengthText.textContent = 'Надёжность пароля: ' + text;
            strengthText.style.color = color;
        }
        
        function validatePasswordMatch() {
            const password = document.getElementById('newPassword')?.value || '';
            const confirm = document.getElementById('confirmPassword')?.value || '';
            const errorEl = document.getElementById('confirmError');
            
            if (!confirm) {
                if (errorEl) errorEl.style.display = 'none';
                return true;
            }
            
            if (password !== confirm) {
                if (errorEl) {
                    errorEl.textContent = 'Пароли не совпадают';
                    errorEl.style.display = 'block';
                }
                return false;
            } else {
                if (errorEl) errorEl.style.display = 'none';
                return true;
            }
        }
        
        document.getElementById('newPassword')?.addEventListener('input', () => {
            checkPasswordStrength();
            validatePasswordMatch();
        });
        
        document.getElementById('confirmPassword')?.addEventListener('input', validatePasswordMatch);
        
        async function sendResetCode() {
            const email = document.getElementById('resetEmail').value.trim();
            
            if (!email) {
                showError('emailError', 'Введите email');
                return;
            }
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('emailError', 'Введите корректный email');
                return;
            }
            
            hideError('emailError');
            
            const btn = document.getElementById('sendCodeBtn');
            const originalText = btn.innerHTML;
            
            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Отправка...';
                
                const formData = new URLSearchParams();
                formData.append('email', email);
                
                const response = await fetch(`${API_BASE_URL}/Auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resetEmail = email;
                    showNotification('Код отправлен на email', 'success');
                    
                    // Переключаем на шаг 2
                    document.getElementById('step1').classList.remove('active');
                    document.getElementById('step2').classList.add('active');
                    document.getElementById('stepDescription').textContent = 'Введите код из письма и новый пароль';
                    
                    // Запускаем таймер
                    startTimer(900);
                } else {
                    showError('emailError', data.message || 'Ошибка отправки кода');
                }
            } catch (error) {
                showError('emailError', 'Ошибка соединения с сервером');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }
        
        function startTimer(seconds) {
            const timerEl = document.getElementById('timer');
            timerEl.style.display = 'block';
            
            let remaining = seconds;
            
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                const minutes = Math.floor(remaining / 60);
                const secs = remaining % 60;
                timerEl.innerHTML = `Код действителен: ${minutes}:${secs.toString().padStart(2, '0')}`;
                
                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    timerEl.innerHTML = '<span style="color:#ef4444;">Код истёк. Запросите новый.</span>';
                }
                remaining--;
            }, 1000);
        }
        
        async function resetPassword() {
            const code = document.getElementById('resetCode').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            let isValid = true;
            
            if (!code) {
                showError('codeError', 'Введите код подтверждения');
                isValid = false;
            } else if (!/^\d{6}$/.test(code)) {
                showError('codeError', 'Код должен состоять из 6 цифр');
                isValid = false;
            } else {
                hideError('codeError');
            }
            
            if (!newPassword) {
                showError('passwordError', 'Введите новый пароль');
                isValid = false;
            } else if (newPassword.length < 6) {
                showError('passwordError', 'Пароль должен быть не менее 6 символов');
                isValid = false;
            } else {
                hideError('passwordError');
            }
            
            if (newPassword !== confirmPassword) {
                showError('confirmError', 'Пароли не совпадают');
                isValid = false;
            } else {
                hideError('confirmError');
            }
            
            if (!isValid) return;
            
            const btn = document.getElementById('resetBtn');
            const originalText = btn.innerHTML;
            
            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Сброс...';
                
                const formData = new URLSearchParams();
                formData.append('email', resetEmail);
                formData.append('code', code);
                formData.append('newPassword', newPassword);
                
                const response = await fetch(`${API_BASE_URL}/Auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showNotification('Пароль успешно изменён!', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showError('codeError', data.message || 'Ошибка сброса пароля');
                }
            } catch (error) {
                showError('codeError', 'Ошибка соединения с сервером');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }
        
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
